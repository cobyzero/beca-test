server {
    listen 3030;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para carga ultra rápida en Flutter Web
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # Soporte para Single Page Application (SPA):
    # Si la ruta no es un archivo estático real, redirige internamente a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché agresivo para archivos estáticos con hash/inmutables
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|wasm|json)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # Manejo de errores 50x
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

